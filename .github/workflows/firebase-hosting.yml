name: Deploy to Firebase Hosting
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install and build functions dependencies
        run: cd functions && npm ci && npm run build
      - name: Validate required secrets
        run: |
          missing=""
          [ -z "$NEXT_PUBLIC_FIREBASE_API_KEY" ] && missing="$missing NEXT_PUBLIC_FIREBASE_API_KEY"
          [ -z "$NEXT_PUBLIC_FIREBASE_PROJECT_ID" ] && missing="$missing NEXT_PUBLIC_FIREBASE_PROJECT_ID"
          [ -z "$NEXT_PUBLIC_GOOGLE_CLIENT_ID" ] && missing="$missing NEXT_PUBLIC_GOOGLE_CLIENT_ID"
          [ -z "$GOOGLE_CLIENT_SECRET" ] && missing="$missing GOOGLE_CLIENT_SECRET"
          [ -z "$VAPID_PRIVATE_KEY" ] && missing="$missing VAPID_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            exit 1
          fi
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      - name: Generate production environment configuration
        run: |
          cat << 'EOF' > .env.production
          NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || 'agf-task-manager.firebaseapp.com' }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID || 'agf-task-manager' }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET || 'agf-task-manager.firebasestorage.app' }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || '788861047654' }}
          NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID || '1:788861047654:web:42b701aac84f3ead53aea7' }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_CONTACT_EMAIL=${{ secrets.VAPID_CONTACT_EMAIL }}
          NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
          ADMIN_UID=${{ secrets.ADMIN_UID }}
          NEXT_PUBLIC_ADMIN_UID=${{ secrets.NEXT_PUBLIC_ADMIN_UID }}
          FIREBASE_ADMIN_SERVICE_ACCOUNT=${{ secrets.FIREBASE_ADMIN_SERVICE_ACCOUNT }}
          EOF

          # Also decode service account into lib/firebase/service-account.json for server bundle compilation
          if [ -n "${{ secrets.FIREBASE_ADMIN_SERVICE_ACCOUNT }}" ]; then
            echo "${{ secrets.FIREBASE_ADMIN_SERVICE_ACCOUNT }}" | base64 -d > lib/firebase/service-account.json 2>/dev/null || true
            if ! grep -q "private_key" lib/firebase/service-account.json 2>/dev/null; then
              echo "${{ secrets.FIREBASE_ADMIN_SERVICE_ACCOUNT }}" > lib/firebase/service-account.json
            fi
            echo "Generated lib/firebase/service-account.json for build"
          fi

      - name: Deploy to Firebase Hosting and Functions
        run: |
          if [ -n "$FIREBASE_ADMIN_SERVICE_ACCOUNT" ]; then
            echo "$FIREBASE_ADMIN_SERVICE_ACCOUNT" | base64 -d > "$RUNNER_TEMP/firebase-service-account.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
            echo "Authenticated via GOOGLE_APPLICATION_CREDENTIALS"
          fi

          DEPLOY_CMD="npx firebase-tools deploy --only hosting,functions --non-interactive --force"
          if [ -z "$GOOGLE_APPLICATION_CREDENTIALS" ] && [ -n "${{ secrets.FIREBASE_TOKEN }}" ]; then
            DEPLOY_CMD="$DEPLOY_CMD --token ${{ secrets.FIREBASE_TOKEN }}"
          fi

          echo "Executing deployment..."
          $DEPLOY_CMD || {
            echo "::warning::Initial deployment attempt encountered an error. Retrying in 10 seconds..."
            sleep 10
            if [ -n "${{ secrets.FIREBASE_TOKEN }}" ] && [[ "$DEPLOY_CMD" != *"--token"* ]]; then
              echo "Retrying with FIREBASE_TOKEN..."
              unset GOOGLE_APPLICATION_CREDENTIALS
              DEPLOY_CMD="npx firebase-tools deploy --token ${{ secrets.FIREBASE_TOKEN }} --only hosting,functions --non-interactive --force"
            fi
            $DEPLOY_CMD --debug
          }
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
          FIREBASE_CLI_PREVIEWS: webframeworks
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || 'agf-task-manager.firebaseapp.com' }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID || 'agf-task-manager' }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET || 'agf-task-manager.firebasestorage.app' }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || '788861047654' }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID || '1:788861047654:web:42b701aac84f3ead53aea7' }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_CONTACT_EMAIL: ${{ secrets.VAPID_CONTACT_EMAIL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          ADMIN_UID: ${{ secrets.ADMIN_UID }}
          NEXT_PUBLIC_ADMIN_UID: ${{ secrets.NEXT_PUBLIC_ADMIN_UID }}
          FIREBASE_ADMIN_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_ADMIN_SERVICE_ACCOUNT }}
      - name: Output Firebase Debug Log on Failure
        if: failure()
        run: |
          if [ -f firebase-debug.log ]; then
            echo "=== FIREBASE DEBUG LOG ==="
            tail -n 120 firebase-debug.log
          fi

